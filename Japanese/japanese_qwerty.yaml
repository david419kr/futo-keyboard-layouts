name: Japanese QWERTY
languages: ja
imeHint: qwerty
overrideWidths:
  Custom1: 0.04
rows:
  - letters: Q|q W|w E|e R|r T|t Y|y U|u I|i O|o P|p
  - letters: A|a S|s D|d F|f G|g H|h J|j K|k L|l
  - letters: ー Z|z X|x C|c V|v B|b N|n M|m $delete
  - bottom:
      - type: base
        spec: "!?#|!code/key_switch_alpha_symbol"
        attributes: &halfFunctional { style: Functional, width: Custom1, labelFlags: {} }
      - type: base
        spec: "A|_"
        code: -20
        attributes: *halfFunctional
      - "、|,"
      - $action
      - $space
      - "。|."
      - $enter
subKeyboards:
  # ABC
  Alphabet1:
    rows:
      - letters: q w e r t y u i o p
      - letters: a s d f g h j k l
      - letters: $shift z x c v b n m $delete
      - bottom:
          - type: base
            spec: "あ|_"
            code: -19
            attributes: {width: FunctionalKey}
          - type: base
            spec: "!text/keylabel_to_symbol|!code/key_switch_alpha_symbol"
            attributes: {width: Regular}
          - ","
          - $space
          - "."
          - $enter
