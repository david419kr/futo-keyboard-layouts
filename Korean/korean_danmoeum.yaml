name: 단모음 (Danmoeum)
languages: ko
combiners:
  - KoreanCombineInitials
attributes: {shiftable: false, moreKeyMode: OnlyExplicit}
autoShift: false
minimumFunctionalKeyWidth: 0.0
rows:
  - letters:
    - {type: base, spec: "ㅂ", moreKeys: ["+"]}
    - {type: base, spec: "ㅈ", moreKeys: ["×"]}
    - {type: base, spec: "ㄷ", moreKeys: ["÷"]}
    - {type: base, spec: "ㄱ", moreKeys: ["="]}
    - {type: base, spec: "ㅅ", moreKeys: ["/"]}
    - {type: base, spec: "ㅗ", moreKeys: ["-"]}
    - {type: base, spec: "ㅐ", moreKeys: ["("]}
    - {type: base, spec: "ㅔ", moreKeys: [")"]}

  - letters:
    - {type: base, spec: "ㅁ", moreKeys: ["!"]}
    - {type: base, spec: "ㄴ", moreKeys: ["@"]}
    - {type: base, spec: "ㅇ", moreKeys: ["#"]}
    - {type: base, spec: "ㄹ", moreKeys: ["%"]}
    - {type: base, spec: "ㅎ", moreKeys: ["^"]}
    - {type: base, spec: "ㅓ", moreKeys: ["&"]}
    - {type: base, spec: "ㅏ", moreKeys: ["*"]}
    - {type: base, spec: "ㅣ", moreKeys: ["-"]}

  - letters:
    - {type: base, spec: "ㅋ", moreKeys: ["'"]}
    - {type: base, spec: "ㅌ", moreKeys: ['"']}
    - {type: base, spec: "ㅊ", moreKeys: [":"]}
    - {type: base, spec: "ㅍ", moreKeys: [";"]}
    - {type: base, spec: "ㅜ", moreKeys: [","]}
    - {type: base, spec: "ㅡ", moreKeys: ["?"]}
    - $delete
